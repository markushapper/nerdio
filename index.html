<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Nerdio</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="backdrop glow-blue"></div>
  <div class="backdrop glow-violet"></div>
  <main class="app-shell">
    <header class="topbar">
      <button id="backButton" class="icon-button hidden" type="button" aria-label="Zur Pack-Auswahl">←</button>
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 120 56" role="img" aria-hidden="true">
            <path d="M6 39 C 14 39, 18 15, 30 15 C 42 15, 44 43, 58 43 C 72 43, 76 11, 90 11 C 102 11, 104 37, 114 37" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="eyebrow">MUSIC · PLAY</div>
          <h1 id="screenTitle">NERDIO</h1>
        </div>
      </div>
      <button id="installButton" class="ghost-button hidden" type="button">Installieren</button>
    </header>

    <section id="libraryScreen" class="screen active" aria-labelledby="screenTitle">
      <div class="intro-card neon-panel">
        <h2>Musik an. Karten raus.</h2>
        <p>Pack wählen, Song starten, am Tisch spielen, Lösung aufdecken.</p>
      </div>

      <div id="packList" class="pack-list" aria-live="polite"></div>

      <label class="import-button" for="packFileInput">＋ Pack importieren</label>
      <input id="packFileInput" class="visually-hidden" type="file" accept="application/json,.json" />
      <p id="libraryMessage" class="message" role="status"></p>
    </section>

    <section id="playScreen" class="screen" aria-live="polite">
      <div class="round-meta">
        <span id="roundLabel">Song 1 / 1</span>
        <button id="shuffleButton" class="text-button" type="button">Neu mischen</button>
      </div>

      <div id="nativeTimerBar" class="timer-bar native-only">
        <label for="timerSeconds">Songdauer</label>
        <select id="timerSeconds" aria-label="Songdauer">
          <option value="5">5 s</option>
          <option value="10" selected>10 s</option>
          <option value="15">15 s</option>
          <option value="20">20 s</option>
          <option value="30">30 s</option>
        </select>
        <span id="timerStatus" class="timer-status">Bereit</span>
      </div>

      <article class="song-card neon-panel">
        <div id="mysteryState">
          <div class="record-wrap" aria-hidden="true">
            <div class="wave left"></div>
            <div class="record">
              <div class="record-center">
                <svg viewBox="0 0 120 56" role="img" aria-hidden="true">
                  <path d="M6 39 C 14 39, 18 15, 30 15 C 42 15, 44 43, 58 43 C 72 43, 76 11, 90 11 C 102 11, 104 37, 114 37" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <div class="wave right"></div>
          </div>
          <p class="mystery-label">Hören. Spielen. Dann aufdecken.</p>
          <a id="playLink" class="primary-button" href="#" target="_blank" rel="noopener noreferrer">▶ Song starten</a>
          <button id="revealButton" class="secondary-button large" type="button">👁 Lösung aufdecken</button>
        </div>

        <div id="revealState" class="hidden">
          <div class="solution-label">Lösung</div>
          <div class="cover-placeholder">♫</div>
          <h2 id="songTitle"></h2>
          <p id="songArtist" class="artist"></p>
          <div id="songYear" class="year"></div>
          <button id="nextButton" class="primary-button" type="button">Nächster Song →</button>
        </div>
      </article>

      <button id="skipButton" class="text-button danger-soft" type="button">Song funktioniert nicht · überspringen</button>
      <p id="playMessage" class="message" role="status"></p>
    </section>
  </main>

  <dialog id="confirmDialog">
    <form method="dialog" class="dialog-card">
      <h2 id="dialogTitle">Bestätigen</h2>
      <p id="dialogText"></p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-button">Abbrechen</button>
        <button id="dialogConfirm" value="confirm" class="primary-button">Bestätigen</button>
      </div>
    </form>
  </dialog>

  <script src="./game-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
