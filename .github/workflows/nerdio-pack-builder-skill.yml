name: Build Nerdio Pack Builder Skill

on:
  push:
    branches: ["main"]
    paths:
      - "skills/nerdio-pack-builder/**"
      - ".github/workflows/nerdio-pack-builder-skill.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "skills/nerdio-pack-builder/**"
      - ".github/workflows/nerdio-pack-builder-skill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-skill:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run validator tests
        run: python3 -m unittest discover -s skills/nerdio-pack-builder/tests -p 'test_*.py' -v

      - name: Verify required skill files
        run: |
          test -f skills/nerdio-pack-builder/SKILL.md
          test -f skills/nerdio-pack-builder/agents/openai.yaml
          test -f skills/nerdio-pack-builder/scripts/validate_pack.py
          test -f skills/nerdio-pack-builder/references/gamepack-schema.json

      - name: Build clean skill.zip
        run: |
          rm -rf dist
          mkdir -p dist/stage/nerdio-pack-builder
          cp skills/nerdio-pack-builder/SKILL.md dist/stage/nerdio-pack-builder/
          cp -R skills/nerdio-pack-builder/agents dist/stage/nerdio-pack-builder/
          cp -R skills/nerdio-pack-builder/assets dist/stage/nerdio-pack-builder/
          cp -R skills/nerdio-pack-builder/references dist/stage/nerdio-pack-builder/
          cp -R skills/nerdio-pack-builder/scripts dist/stage/nerdio-pack-builder/
          find dist/stage -type d -name '__pycache__' -prune -exec rm -rf {} +
          find dist/stage -type f -name '*.pyc' -delete
          cd dist/stage
          zip -r ../skill.zip nerdio-pack-builder

      - name: Verify exact install package
        run: |
          unzip -t dist/skill.zip
          test "$(unzip -Z1 dist/skill.zip | grep -c '/SKILL.md$')" -eq 1
          unzip -l dist/skill.zip | grep -F 'nerdio-pack-builder/SKILL.md'
          test "$(stat -c%s dist/skill.zip)" -le 26214400

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nerdio-pack-builder-skill
          path: dist/skill.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct skill.zip release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nerdio-pack-builder-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/skill.zip --target "$GITHUB_SHA" --title "Nerdio Pack Builder" --notes "Direct install package for ChatGPT. Download skill.zip from this release and upload that file to Skills." --latest
